name: Build QiLong-Dynamic-Whitelist TIPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取本地代碼庫
        uses: actions/checkout@v4

      - name: 2. 安装 ldid (TrollStore 必备签名工具)
        run: |
          brew install ldid

      - name: 3. 呼叫 Clang 執行全項目編譯
        run: |
          make

      - name: 4. 組裝 iOS .app 標準規範目錄
        run: |
          mkdir -p QiLong-Dynamic-Whitelist.app
          cp QiLong-Dynamic-Whitelist QiLong-Dynamic-Whitelist.app/
          cp RootHelper QiLong-Dynamic-Whitelist.app/
          cp src/index.html QiLong-Dynamic-Whitelist.app/
          cp Info.plist QiLong-Dynamic-Whitelist.app/
          test -f src/AppIcon.png && cp src/AppIcon.png QiLong-Dynamic-Whitelist.app/ || echo "No icon found, skipping"

      - name: 5. 使用 ldid 注入巨魔免沙盒特权 (绝对禁止使用 Xcode codesign)
        run: |
          ldid -Ssrc/entitlements.plist QiLong-Dynamic-Whitelist.app/RootHelper
          chmod +x QiLong-Dynamic-Whitelist.app/RootHelper
          ldid -Ssrc/entitlements.plist QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist

      - name: 6. 封裝成標準 TrollStore .tipa 安裝包
        run: |
          mkdir Payload
          mv QiLong-Dynamic-Whitelist.app Payload/
          zip -qr9 QiLong-Dynamic-Whitelist.tipa Payload

      - name: 7. 將編譯好的 TIPA 吐出到網頁提供下载
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-Release
          path: QiLong-Dynamic-Whitelist.tipa