name: Build QiLong-Dynamic-Whitelist (IPA / TIPA / DEB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. Install ldid and dpkg
        run: |
          brew install ldid dpkg

      - name: 3. 编译
        run: |
          make clean
          make

      - name: 4. 组装 .app 目录
        run: |
          mkdir -p QiLong-Dynamic-Whitelist.app
          cp QiLong-Dynamic-Whitelist QiLong-Dynamic-Whitelist.app/
          cp RootHelper QiLong-Dynamic-Whitelist.app/
          cp src/index.html QiLong-Dynamic-Whitelist.app/
          cp Info.plist QiLong-Dynamic-Whitelist.app/
          test -f src/AppIcon.png && cp src/AppIcon.png QiLong-Dynamic-Whitelist.app/ || echo "No icon found, skipping"
          if [ -d "packages" ]; then
            cp -r packages/* QiLong-Dynamic-Whitelist.app/ || true
          fi

      - name: 5. ldid 签名
        run: |
          ldid -Ssrc/entitlements.plist QiLong-Dynamic-Whitelist.app/RootHelper
          chmod +x QiLong-Dynamic-Whitelist.app/RootHelper
          ldid -Ssrc/entitlements.plist QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          chmod +x QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist

      - name: 6. 封装 IPA / TIPA / DEB
        run: |
          # IPA
          mkdir -p Payload
          cp -r QiLong-Dynamic-Whitelist.app Payload/
          zip -qr9 QiLong-Dynamic-Whitelist.ipa Payload

          # TIPA
          cp QiLong-Dynamic-Whitelist.ipa QiLong-Dynamic-Whitelist.tipa

          # DEB (Rootless)
          mkdir -p build_deb/DEBIAN
          mkdir -p build_deb/var/jb/Applications
          cp -r QiLong-Dynamic-Whitelist.app build_deb/var/jb/Applications/

          cat << 'EOF' > build_deb/DEBIAN/control
          Package: com.78bigqilong.dynamicwhitelist
          Name: QiLong-Dynamic-Whitelist
          Version: 1.0.8
          Architecture: iphoneos-arm64
          Description: QiLong AI FangGao Dynamic Whitelist
          Maintainer: 78-big-QiLong
          Author: QiLong-GOLD400
          Section: Utilities
          EOF

          chmod 0755 build_deb/DEBIAN/control
          dpkg-deb -Zxz --root-owner-group -b build_deb QiLong-Dynamic-Whitelist_rootless.deb

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-MultiFormat-Release
          path: |
            QiLong-Dynamic-Whitelist.ipa
            QiLong-Dynamic-Whitelist.tipa
            QiLong-Dynamic-Whitelist_rootless.deb